<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sprout &amp; Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EDF2E1;
    --bg-deep: #E2E9D2;
    --surface: #FCFBF6;
    --ink: #2E2B22;
    --ink-soft: #6B6A5C;
    --matcha: #63804A;
    --matcha-deep: #4C6538;
    --framboise: #C24C79;
    --honey: #E0A22E;
    --plum: #8A5FA0;
    --line: #DADFC8;
    --radius: 18px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 15% -10%, var(--bg-deep) 0%, transparent 60%),
      var(--bg);
    font-family:'Figtree', sans-serif;
    color: var(--ink);
    display:flex;
    justify-content:center;
    padding: 40px 16px 64px;
  }

  .app{ width:100%; max-width: 540px; }

  header{ text-align:center; margin-bottom: 18px; }

  .sprig{ width:40px; height:40px; margin: 0 auto 8px; display:block; }

  h1{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-weight:700;
    font-size: 31px;
    margin: 0 0 4px;
    color: var(--matcha-deep);
    letter-spacing: -0.01em;
  }

  .tagline{ color: var(--ink-soft); font-size: 14.5px; margin:0; }

  /* Tabs */
  .tabs{
    display:flex;
    gap:6px;
    background: rgba(99,128,74,0.1);
    border-radius: 100px;
    padding: 4px;
    margin: 20px auto 18px;
    max-width: 340px;
  }
  .tab{
    flex:1;
    border:none;
    background:transparent;
    font-family:'Figtree', sans-serif;
    font-weight:600;
    font-size: 14px;
    padding: 9px 10px;
    border-radius: 100px;
    color: var(--matcha-deep);
    cursor:pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .tab.active{
    background: var(--matcha);
    color: #fff;
  }
  .tab:focus-visible{ outline: 2px solid var(--matcha-deep); outline-offset:2px; }

  .panel[hidden]{ display:none; }

  .card{
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--line);
    box-shadow: 0 10px 30px -18px rgba(46,43,34,0.25);
    overflow:hidden;
    margin-bottom: 12px;
  }

  /* ---- Grocery tab ---- */
  .add-row{
    display:flex;
    gap:8px;
    padding: 16px 16px 12px;
    border-bottom: 1px solid var(--line);
  }
  .add-row input[type=text]{
    flex:1;
    min-width:0;
    border: 1.5px solid var(--line);
    background: #fff;
    border-radius: 12px;
    padding: 11px 14px;
    font-family:'Figtree', sans-serif;
    font-size: 15px;
    color: var(--ink);
  }
  .add-row input[type=text]:focus{
    outline: none;
    border-color: var(--matcha);
    box-shadow: 0 0 0 3px rgba(99,128,74,0.15);
  }
  .add-row input[type=text]::placeholder{ color:#A9A896; }

  .add-btn{
    flex-shrink:0;
    width: 44px; height: 44px;
    border-radius: 12px;
    border:none;
    background: var(--matcha);
    color: white;
    font-size: 22px;
    line-height:1;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .add-btn:hover{ background: var(--matcha-deep); }
  .add-btn:active{ transform: scale(0.94); }
  .add-btn:focus-visible{ outline: 2px solid var(--matcha-deep); outline-offset:2px; }

  .quick-add{ padding: 12px 16px 16px; border-bottom: 1px solid var(--line); }
  .quick-add .label{ font-size: 12.5px; color: var(--ink-soft); margin-bottom: 8px; }

  .chips{ display:flex; flex-wrap:wrap; gap: 7px; }

  .chip{
    font-family:'Figtree', sans-serif;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 100px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--matcha-deep);
    cursor:pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .chip:hover{ border-color: var(--matcha); background: #F4F7EC; }
  .chip:focus-visible{ outline: 2px solid var(--matcha-deep); outline-offset:1px; }
  .chip.added{ opacity: 0.45; pointer-events:none; }

  .list-area{ padding: 6px 4px 8px; min-height: 90px; }

  .group{ padding: 10px 12px 2px; }

  .group-title{
    display:flex; align-items:center; gap:7px;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 14.5px;
    color: var(--ink-soft);
    margin: 6px 4px 6px;
  }
  .group-title svg{ flex-shrink:0; }

  ul.items, ul.entries{ list-style:none; margin:0; padding:0; }

  li.item, li.entry{
    display:flex; align-items:center; gap: 11px;
    padding: 9px 8px;
    border-radius: 12px;
    transition: background 0.15s ease;
  }
  li.item:hover, li.entry:hover{ background: rgba(99,128,74,0.06); }
  li.item:hover .del, li.entry:hover .del{ opacity:1; }

  .check{
    flex-shrink:0;
    width: 24px; height:24px;
    border-radius:50%;
    border: 2px solid #C7CBB2;
    background:#fff;
    cursor:pointer;
    position:relative;
    display:flex; align-items:center; justify-content:center;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.12s ease;
  }
  .check:hover{ border-color: var(--matcha); }
  .check:focus-visible{ outline: 2px solid var(--matcha-deep); outline-offset:2px; }
  .check.checked{ background: var(--honey); border-color: var(--honey); animation: pop 0.28s ease; }
  @keyframes pop{ 0%{ transform: scale(1); } 40%{ transform: scale(1.22); } 100%{ transform: scale(1); } }
  .check svg{
    width:13px; height:13px;
    stroke: white; stroke-width:3; fill:none;
    stroke-linecap:round; stroke-linejoin:round;
    opacity:0; transform: scale(0.6);
    transition: opacity 0.12s ease, transform 0.12s ease;
  }
  .check.checked svg{ opacity:1; transform: scale(1); }

  .item-text, .entry-text{
    flex:1; font-size: 15.5px; color: var(--ink);
    word-break: break-word; position:relative;
  }
  .item.checked .item-text, li.entry.done .entry-text{ color: var(--ink-soft); }
  .item.checked .item-text::after, li.entry.done .entry-text::after{
    content:"";
    position:absolute; left:0; right:0; top:50%;
    height: 6px;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 8'><path d='M0 5 Q 10 1, 20 5 T 40 5 T 60 5 T 80 5 T 100 5' fill='none' stroke='%23C24C79' stroke-width='2'/></svg>") repeat-x;
    background-size: 40px 6px;
    transform: translateY(-50%);
    opacity: 0.85;
  }

  .del{
    flex-shrink:0; opacity:0;
    width:26px; height:26px;
    border-radius:8px; border:none;
    background:transparent; color: var(--ink-soft);
    cursor:pointer; font-size:16px;
    transition: opacity 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .del:hover{ background: rgba(194,76,121,0.12); color: var(--framboise); }
  .del:focus-visible{ opacity:1; outline: 2px solid var(--framboise); outline-offset:1px; }

  .empty{ text-align:center; padding: 34px 20px 30px; color: var(--ink-soft); }
  .empty-emoji{ font-size: 26px; margin-bottom:6px; }
  .empty p{ margin:0; font-size:14.5px; }

  footer{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding: 12px 16px 16px;
    border-top: 1px solid var(--line);
    font-size: 13px;
    color: var(--ink-soft);
  }
  .footer-actions{ display:flex; gap:14px; flex-wrap:wrap; justify-content:flex-end; }
  .footer-actions button, footer > button{
    background:none; border:none;
    font-family:'Figtree', sans-serif; font-size: 13px;
    color: var(--matcha-deep);
    cursor:pointer; padding:2px 0;
    text-decoration: underline; text-decoration-color: transparent;
    transition: text-decoration-color 0.15s ease;
  }
  .footer-actions button:hover, footer > button:hover{ text-decoration-color: var(--matcha-deep); }
  .footer-actions button.danger, footer > button.danger{ color: var(--framboise); }
  .footer-actions button.danger:hover, footer > button.danger:hover{ text-decoration-color: var(--framboise); }
  .footer-actions button:focus-visible, footer > button:focus-visible{ outline: 2px solid var(--matcha-deep); outline-offset:2px; }

  .status{ text-align:center; padding: 30px 20px; color: var(--ink-soft); font-size: 14px; }

  /* ---- This Week tab ---- */
  .recipe-box{ padding: 14px 16px 4px; }
  .recipe-box .label{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 14.5px;
    color: var(--matcha-deep);
    margin-bottom: 10px;
  }
  .rb-scroll{
    max-height: 230px;
    overflow-y: auto;
    padding-right: 4px;
    margin-bottom: 10px;
  }
  .rb-group{ margin-bottom: 10px; }
  .rb-group-title{
    font-size: 11.5px;
    font-weight:700;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
    margin: 0 0 6px 2px;
  }
  .rb-chips{ display:flex; flex-wrap:wrap; gap:7px; }
  .rb-chip{
    font-family:'Figtree', sans-serif;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 100px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    cursor:pointer;
    position:relative;
  }
  .rb-chip:hover{ border-color: var(--matcha); }
  .rb-chip:focus-visible{ outline: 2px solid var(--matcha-deep); outline-offset:1px; }

  .day-popover{
    position:absolute; z-index: 20;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 12px 28px -10px rgba(46,43,34,0.35);
    padding: 8px;
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    min-width: 190px;
  }
  .day-popover button{
    font-family:'Figtree', sans-serif;
    font-size: 12.5px;
    padding: 7px 4px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background:#fff;
    cursor:pointer;
    color: var(--ink);
  }
  .day-popover button:hover{ background: #F4F7EC; border-color: var(--matcha); }
  .day-popover .hint{
    grid-column: 1 / -1;
    font-size: 11px;
    color: var(--ink-soft);
    text-align:center;
    padding-bottom: 3px;
  }

  .day-card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow:hidden;
    box-shadow: 0 8px 22px -18px rgba(46,43,34,0.2);
  }
  .day-header{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 16px;
    color: var(--ink);
    padding: 12px 16px 8px;
  }

  .meal-tag{
    flex-shrink:0;
    font-size: 11.5px;
    font-weight:600;
    padding: 4px 9px;
    border-radius: 100px;
    border:none;
    cursor:pointer;
    color:#fff;
    white-space:nowrap;
  }
  .meal-tag:focus-visible{ outline: 2px solid var(--ink); outline-offset:1px; }
  .tag-breakfast{ background: var(--honey); }
  .tag-lunch{ background: var(--matcha); }
  .tag-dinner{ background: var(--framboise); }
  .tag-dessert{ background: var(--plum); }

  .week-add-row{ display:flex; gap:8px; padding: 8px 12px 12px; }
  .week-add-row input[type=text]{
    flex:1; min-width:0;
    border: 1.5px solid var(--line);
    background:#fff;
    border-radius: 10px;
    padding: 8px 12px;
    font-family:'Figtree', sans-serif;
    font-size: 14.5px;
    color: var(--ink);
  }
  .week-add-row input[type=text]:focus{
    outline:none; border-color: var(--matcha);
    box-shadow: 0 0 0 3px rgba(99,128,74,0.15);
  }
  .week-add-row input[type=text]::placeholder{ color:#A9A896; }
  .week-add-btn{
    flex-shrink:0; width: 38px; height:38px;
    border-radius: 10px; border:none;
    background: var(--matcha); color:white;
    font-size:19px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .week-add-btn:hover{ background: var(--matcha-deep); }
  .week-add-btn:active{ transform: scale(0.94); }
  .week-add-btn:focus-visible{ outline: 2px solid var(--matcha-deep); outline-offset:2px; }

  .week-footer{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding: 6px 4px 0;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .week-footer button{
    background:none; border:none;
    font-family:'Figtree', sans-serif; font-size: 13px;
    color: var(--framboise); cursor:pointer;
    text-decoration: underline; text-decoration-color: transparent;
    transition: text-decoration-color 0.15s ease;
  }
  .week-footer button:hover{ text-decoration-color: var(--framboise); }
  .week-footer button:focus-visible{ outline: 2px solid var(--framboise); outline-offset:2px; }

  @media (max-width: 380px){
    h1{ font-size: 26px; }
    .item-text, .entry-text{ font-size:15px; }
  }

  .entry-text.clickable{ cursor:pointer; }
  .entry-text.clickable:hover{ text-decoration: underline; text-decoration-color: var(--matcha); text-underline-offset: 3px; }

  /* ---- Recipe modal ---- */
  .modal-backdrop{
    position: fixed; inset: 0;
    background: rgba(46,43,34,0.42);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index: 100;
    padding: 0;
  }
  .modal-backdrop[hidden]{ display:none; }
  @media (min-width: 560px){
    .modal-backdrop{ align-items:center; padding: 20px; }
  }

  .modal-card{
    background: var(--surface);
    width: 100%;
    max-width: 520px;
    max-height: 88vh;
    overflow-y: auto;
    border-radius: 22px 22px 0 0;
    box-shadow: 0 -10px 40px rgba(46,43,34,0.3);
    padding: 22px 22px 28px;
    position: relative;
  }
  @media (min-width: 560px){
    .modal-card{ border-radius: 22px; padding: 26px 28px 30px; }
  }

  .modal-close{
    position: absolute;
    top: 14px; right: 14px;
    width: 32px; height: 32px;
    border-radius: 50%;
    border: none;
    background: rgba(99,128,74,0.1);
    color: var(--matcha-deep);
    font-size: 17px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .modal-close:hover{ background: rgba(99,128,74,0.2); }
  .modal-close:focus-visible{ outline: 2px solid var(--matcha-deep); outline-offset:2px; }

  .modal-meal-tag{
    display:inline-block;
    font-size: 11.5px;
    font-weight:600;
    padding: 4px 10px;
    border-radius: 100px;
    color:#fff;
    margin-bottom: 10px;
  }

  .modal-title{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 23px;
    color: var(--ink);
    margin: 0 0 6px;
    padding-right: 30px;
  }

  .modal-desc{
    color: var(--ink-soft);
    font-size: 14.5px;
    margin: 0 0 4px;
    line-height:1.5;
  }

  .modal-servings{
    font-size: 13px;
    color: var(--matcha-deep);
    font-weight:600;
    margin: 10px 0 4px;
  }

  .modal-times{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 18px;
  }

  .modal-times strong{
    color: var(--ink);
    font-weight:600;
    margin-right:4px;
  }

  .modal-section-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 15.5px;
    color: var(--matcha-deep);
    margin: 20px 0 10px;
  }

  ul.modal-ingredients{
    list-style:none;
    margin:0; padding:0;
  }
  ul.modal-ingredients li{
    font-size: 14.5px;
    color: var(--ink);
    padding: 5px 0 5px 20px;
    position:relative;
    line-height:1.4;
  }
  ul.modal-ingredients li::before{
    content:"";
    position:absolute;
    left:2px; top:12px;
    width:6px; height:6px;
    border-radius:50%;
    background: var(--honey);
  }

  ol.modal-steps{
    list-style:none;
    margin:0; padding:0;
    counter-reset: step;
  }
  ol.modal-steps li{
    counter-increment: step;
    display:flex;
    gap:12px;
    padding: 10px 0;
    border-top: 1px solid var(--line);
  }
  ol.modal-steps li:first-child{ border-top:none; }
  ol.modal-steps li::before{
    content: counter(step);
    flex-shrink:0;
    width: 24px; height:24px;
    border-radius:50%;
    background: var(--matcha);
    color:#fff;
    font-size: 12.5px;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
    margin-top: 1px;
  }
  .modal-step-body{ flex:1; }
  .modal-step-title{
    font-weight:600;
    font-size: 14.5px;
    color: var(--ink);
    margin-bottom: 2px;
  }
  .modal-step-content{
    font-size: 14px;
    color: var(--ink-soft);
    line-height:1.5;
  }

  .modal-notes{
    margin-top: 18px;
    padding: 12px 14px;
    background: rgba(224,162,46,0.12);
    border-radius: 12px;
    font-size: 13.5px;
    color: var(--ink);
    line-height:1.5;
  }
  .modal-notes strong{ color: var(--matcha-deep); }

  .modal-empty{
    text-align:center;
    padding: 30px 10px 10px;
    color: var(--ink-soft);
    font-size: 14.5px;
  }

  /* ---- Toast ---- */
  .toast{
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(20px);
    background: var(--matcha-deep);
    color: #fff;
    font-family:'Figtree', sans-serif;
    font-size: 13.5px;
    font-weight:600;
    padding: 11px 20px;
    border-radius: 100px;
    box-shadow: 0 10px 30px -10px rgba(46,43,34,0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 200;
    max-width: 90vw;
    text-align:center;
  }
  .toast.show{
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <svg class="sprig" viewBox="0 0 48 48" fill="none">
      <path d="M24 42V22" stroke="#63804A" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M24 24C24 24 12 22 10 12C10 12 24 10 24 24Z" fill="#8CAE68"/>
      <path d="M24 22C24 22 36 20 38 10C38 10 24 8 24 22Z" fill="#63804A"/>
      <circle cx="24" cy="41" r="3.5" fill="#E0A22E"/>
    </svg>
    <h1>Sprout &amp; Table</h1>
    <p class="tagline">for Nikki, Rylan &amp; Ruby</p>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="grocery">Grocery List</button>
    <button class="tab" data-tab="week">This Week</button>
  </div>

  <!-- GROCERY PANEL -->
  <div class="panel" id="groceryPanel">
    <div class="card">
      <div class="add-row">
        <input id="newItemInput" type="text" placeholder="Add an item…" autocomplete="off" />
        <button class="add-btn" id="addBtn" aria-label="Add item">+</button>
      </div>
      <div class="quick-add">
        <div class="label">frequent finds</div>
        <div class="chips" id="quickAddChips"></div>
      </div>
      <div class="list-area" id="listArea">
        <div class="status">Loading your list…</div>
      </div>
      <footer>
        <span id="countLabel">0 items</span>
        <div class="footer-actions">
          <button id="downloadListBtn">Download list</button>
          <button id="clearCheckedBtn">Clear checked</button>
          <button id="clearAllBtn" class="danger">Clear all</button>
        </div>
      </footer>
    </div>
  </div>

  <!-- WEEK PANEL -->
  <div class="panel" id="weekPanel" hidden>
    <div class="card recipe-box">
      <div class="label">your recipe box — tap to add to a day</div>
      <div class="rb-scroll" id="recipeBoxScroll"></div>
    </div>

    <div id="week"><div class="status">Loading your week…</div></div>

    <div class="week-footer">
      <span id="weekCountLabel">0 meals planned</span>
      <button id="clearWeekBtn">Clear week</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="recipeModalBackdrop" hidden>
  <div class="modal-card" id="recipeModalCard" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  /* ---------- shared helpers ---------- */
  function uid(prefix){
    return prefix + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8);
  }
  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  function escapeAttr(str){

  function categorize(text){

  /* ---- unit-aware quantity math shared by the grocery/week logic ---- */
  const VOLUME_TO_TSP = { tsp:1, tbsp:3, cup:48 };
  const WEIGHT_TO_G = { g:1, kg:1000, oz:28.3495, lb:453.592 };

  function unitFamily(unit){
    if (!unit) return 'count';
    if (unit === 'pinch') return 'pinch';
    if (VOLUME_TO_TSP[unit]) return 'volume';
    if (WEIGHT_TO_G[unit]) return 'weight';
    return 'other';
  }
  function convertAmount(amount, fromUnit, toUnit){
    if (fromUnit === toUnit) return amount;
    const fam = unitFamily(fromUnit);
    if (fam === 'volume') return amount * VOLUME_TO_TSP[fromUnit] / VOLUME_TO_TSP[toUnit];
    if (fam === 'weight') return amount * WEIGHT_TO_G[fromUnit] / WEIGHT_TO_G[toUnit];
    return amount;
  }
  function formatFraction(value){
    if (Math.abs(value - Math.round(value)) < 0.02) return String(Math.round(value));
    const whole = Math.floor(value + 1e-9);
    const frac = value - whole;
    const fractions = [[0.125,'1/8'],[0.25,'1/4'],[0.333333,'1/3'],[0.375,'3/8'],[0.5,'1/2'],[0.625,'5/8'],[0.666667,'2/3'],[0.75,'3/4'],[0.875,'7/8']];
    let best = null, bestDiff = Infinity;
    fractions.forEach(([f, label]) => {
      const diff = Math.abs(frac - f);
      if (diff < bestDiff){ bestDiff = diff; best = label; }
    });
    if (bestDiff > 0.03){
      const rounded = Math.round(value * 100) / 100;
      return String(rounded);
    }
    return whole > 0 ? whole + ' ' + best : best;
  }

  // Per Nikki's preference: measured ingredients (cup/tbsp/tsp/oz/lb/g/kg/pinch) show just the
  // name, no cooking measurement — the fact that it's on the list at all already means "buy some."
  // Discrete/countable ingredients (no unit) keep their count, since "how many" is the useful part.
  function formatGroceryLine(item){
    const { amount, unit, name, namePlural } = item;
    if (!unit){
      if (amount == null) return name;
      const displayName = Math.abs(amount - 1) < 0.001 ? name : (namePlural || (name + 's'));
      return formatFraction(amount) + ' ' + displayName;
    }
    return name.charAt(0).toUpperCase() + name.slice(1);
  }

  function findGroceryOrDerived(id){
    const manual = groceryItems.find(i => i.id === id);
    if (manual) return { item: manual, isDerived: false };
    const derived = derivedItems.find(i => i.id === id);
    if (derived) return { item: derived, isDerived: true };
    return null;
  }

  function toggleGroceryItem(id){
    const found = findGroceryOrDerived(id);
    if (!found) return;
    found.item.checked = !found.item.checked;
    if (found.isDerived){
      derivedChecked[found.item.name.toLowerCase()] = found.item.checked;
      saveDerivedChecked();
    } else {
      saveGrocery();
    }
    renderGrocery();
  }
  function deleteGroceryItem(id){
    const found = findGroceryOrDerived(id);
    if (!found) return;
    if (found.isDerived){
      delete derivedChecked[found.item.name.toLowerCase()];
      saveDerivedChecked();
      derivedItems = derivedItems.filter(i => i.id !== id);
      // Note: if the underlying need is still real (not enough in stock), this line will
      // reappear next time the week plan or pantry stock changes — deleting the line doesn't
      // erase the shortfall itself.
    } else {
      groceryItems = groceryItems.filter(i => i.id !== id);
      saveGrocery();
    }
    renderGrocery();
  }

  function buildGroceryListText(itemsSnapshot){
    const allItems = itemsSnapshot || groceryItems.concat(derivedItems);
    const toBuy = allItems.filter(i => !i.checked);
    const dateStr = new Date().toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
    let lines = ['Sprout & Table — Grocery List (' + dateStr + ')', ''];

        lines.push(cat.label.toUpperCase());

    return lines.join('\n').trim() + '\n';

  // Crediting pantry stock only happens here, at download time — per Nikki's choice,
  // "bought" means "I downloaded the list to go buy it," not just checking a box.
  function creditPantryStock(item){
    const key = item.name.toLowerCase();
    if (!pantryStock[key]){
      pantryStock[key] = { amount: item.amount, unit: item.unit, name: item.name, namePlural: item.namePlural || null };
      return;
    }
    const fam1 = unitFamily(pantryStock[key].unit);
    const fam2 = unitFamily(item.unit);
    if (fam1 === fam2 && fam1 !== 'other'){
      pantryStock[key].amount += convertAmount(item.amount, item.unit, pantryStock[key].unit);
    } else {
      pantryStock[key].amount += item.amount;
    }
  }

  function downloadGroceryList(){
    const snapshot = groceryItems.concat(derivedItems);
    const text = buildGroceryListText(snapshot);

    derivedItems.forEach(item => {

      creditedAny = true;

    saveGrocery();
    recomputeDerivedGroceryItems(); // now-covered recipe ingredients drop off the list

    const blob = new Blob([text], { type: 'text/plain' });

    const dateSlug = new Date().toISOString().slice(0,10);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'grocery-list-' + dateSlug + '.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Downloaded ' + a.download);
  }

    'Nutella Framboise Cookie': {
      servings: 14,
      prepTime: "30 min",
      cookTime: "14 min",
      totalTime: "2 hr 15 min (includes freezing and chilling)",
      description: "A copycat take on the bakery's signature stuffed cookie — a thick, chewy dark chocolate cookie studded with real raspberry couverture and hiding a molten Nutella center, finished with flaky sea salt.",
      ingredients: ['1 cup unsalted butter, softened','3/4 cup granulated sugar','3/4 cup brown sugar, packed','2 large eggs','2 tsp vanilla extract','2 3/4 cups all-purpose flour','1 tsp baking soda','1/2 tsp baking powder','1 tsp fine sea salt','6 oz 70% dark chocolate, chopped into chunks','1/2 cup Nutella','4 oz Valrhona Inspiration Framboise (raspberry couverture), chopped into chunks','1 tsp flaky sea salt, for topping'],
      steps: [
        {title:'Freeze the Nutella filling', content:'Scoop the Nutella into 14 small teaspoon-size dollops onto a parchment-lined tray. Freeze until solid, at least 1 hour (or overnight).'},

        {title:'Add eggs and vanilla', content:'Beat in the eggs one at a time, then mix in the vanilla.'},
        {title:'Mix dry ingredients', content:'Whisk together the flour, baking soda, baking powder, and salt. Gradually add to the butter mixture, mixing just until combined.'},
        {title:'Fold in chocolate', content:'Fold in the dark chocolate and most of the raspberry couverture, reserving a small handful for the filling.'},
        {title:'Assemble stuffed cookies', content:'Scoop about 3 tablespoons of dough and flatten into a disc in your palm. Place one frozen Nutella dollop and 2 to 3 reserved chunks of raspberry couverture in the center, then wrap the dough around and roll into a ball, sealing well.'},
        {title:'Chill the dough balls', content:'Chill on a tray for at least 30 minutes — this keeps the cookies thick and bakery-style.'},

        {title:'Finish with sea salt', content:'Sprinkle each cookie with a pinch of flaky sea salt right out of the oven. Cool on the tray 5 minutes before transferring.'},

    'Matcha Nuage Bar': {
      servings: 9,
      prepTime: "25 min",
      cookTime: "35 min",
      totalTime: "About 5 hr (includes 4+ hr chilling)",
      description: 'A copycat of the bakery\'s matcha cheesecake bar — a graham cracker crust, a dense matcha cheesecake layer, and a piped whipped cream "cloud" dusted with more matcha on top.',
      ingredients: ['1 1/2 cups graham cracker crumbs','6 tbsp unsalted butter, melted','3 tbsp granulated sugar','16 oz cream cheese, softened','12 tbsp granulated sugar (3/4 cup)','2 large eggs','6 tbsp sour cream','1 tsp vanilla extract','3 tbsp culinary-grade matcha powder, sifted','1 cup heavy cream, cold','3 tbsp powdered sugar','1/2 tsp vanilla extract, for the topping','1 tbsp matcha powder, for dusting'],
      steps: [
        {title:'Make the crust', content:'Preheat oven to 325°F. Mix the graham cracker crumbs, melted butter, and sugar together until it looks like wet sand. Press firmly into the bottom of a parchment-lined 8x8-inch pan.'},
        {title:'Pre-bake the crust', content:'Bake for 8 to 10 minutes, then set aside to cool slightly while you make the filling.'},
        {title:'Beat the cream cheese and sugar', content:'In a large bowl, beat the cream cheese and sugar together until smooth and creamy, with no lumps.'},
        {title:'Add eggs and sour cream', content:'Beat in the eggs one at a time, then mix in the sour cream and vanilla until just combined.'},
        {title:'Add the matcha', content:'Sift the matcha into the batter and mix until fully incorporated and streak-free.'},
        {title:'Bake the cheesecake layer', content:'Pour the filling over the crust and smooth the top. Bake 25 to 30 minutes, until the edges are set and the center still jiggles slightly when nudged.'},
        {title:'Cool and chill', content:'Let the bars cool completely at room temperature, then chill in the fridge at least 4 hours (overnight is best) before topping.'},
        {title:'Whip the cloud topping', content:'Beat the heavy cream, powdered sugar, and vanilla together until stiff peaks form.'},
        {title:'Pipe the clouds', content:'Transfer the whipped cream to a piping bag fitted with a large round tip. Pipe wavy, overlapping mounds across the top of the chilled bars to mimic a cloud.'},
        {title:'Dust with matcha', content:'Sift matcha powder generously over the whipped cream clouds. Slice into 9 bars with a hot, clean knife wiped between cuts, and serve chilled.'},
      ],
      notes: 'Bars keep covered in the fridge up to 4 days — pipe the cream and dust with matcha the same day you plan to serve, since matcha dulls in color as it sits on the moist cream.',
    },
    'Honey Apple Galette': {
      servings: 8,
      prepTime: "30 min",
      cookTime: "45 min",
      totalTime: "1 hr 45 min (includes 30 min chilling)",
      description: 'A rustic free-form apple tart with a flaky butter crust, sweetened only with honey.',
      ingredients: ['1 1/4 cups all-purpose flour','1/2 tsp fine salt','8 tbsp cold unsalted butter, cubed','1/4 cup ice water','5 Fuji apples, peeled, cored, thinly sliced','3 tbsp honey, plus more for finishing','1 tbsp lemon juice','1 tsp ground cinnamon','1/8 tsp ground nutmeg','1 tbsp cornstarch','1 pinch salt, for the filling','1 egg, beaten (or milk, for brushing the crust)'],
      steps: [

  function findRecipeGroceryIngredients(text){
    if (RECIPE_GROCERY[text]) return RECIPE_GROCERY[text];
    const lower = text.trim().toLowerCase();
    const key = Object.keys(RECIPE_GROCERY).find(k => k.toLowerCase() === lower);
    return key ? RECIPE_GROCERY[key] : null;
  }

  // Recomputes the recipe-derived portion of the grocery list from scratch: sums ingredient
  // needs across every currently-planned, not-yet-made meal, subtracts whatever's in pantry
  // stock, and keeps only the real shortfall. Full rebuild (rather than incremental patching)
  // so it stays correct no matter what changed — a meal added, removed, marked made, or stock
  // updated via download.
  function recomputeDerivedGroceryItems(){
    const neededTotals = {};
    weekEntries.filter(e => !e.done).forEach(entry => {
      const ingredients = findRecipeGroceryIngredients(entry.text);
      if (!ingredients) return;
      ingredients.forEach(ing => {
        if (SKIP_GROCERY_NAMES.has(ing.name.toLowerCase())) return;
        const key = ing.name.toLowerCase();
        if (!neededTotals[key]){
          neededTotals[key] = { amount: ing.amount, unit: ing.unit, name: ing.name, namePlural: ing.namePlural || null };
        } else {
          const fam1 = unitFamily(neededTotals[key].unit);
          const fam2 = unitFamily(ing.unit);
          if (fam1 === fam2 && fam1 !== 'other'){
            neededTotals[key].amount += convertAmount(ing.amount, ing.unit, neededTotals[key].unit);
          }
          // mismatched unit families for the same ingredient name is rare; keep the first total
        }
      });
    });

    const shortfalls = [];
    Object.keys(neededTotals).forEach(key => {
      const need = neededTotals[key];
      const stock = pantryStock[key];
      let remaining = need.amount;
      if (stock){
        const fam1 = unitFamily(need.unit);
        const fam2 = unitFamily(stock.unit);
        if (fam1 === fam2 && fam1 !== 'other'){
          remaining = need.amount - convertAmount(stock.amount, stock.unit, need.unit);
        }
      }
      const epsilon = unitFamily(need.unit) === 'count' ? 0.05 : 0.01;
      if (remaining > epsilon){
        shortfalls.push({ ...need, amount: remaining });
      }
    });

    derivedItems = shortfalls.map(ing => {
      const key = ing.name.toLowerCase();
      const item = {
        id: uid('i'),
        category: categorize(ing.name),
        checked: !!derivedChecked[key],
        unit: ing.unit,
        name: ing.name,
        namePlural: ing.namePlural,
        amount: ing.amount,
        derived: true,
        text: '',
      };
      item.text = formatGroceryLine(item);
      return item;
    });

    renderGrocery();
  }

  function snapshotDerivedAmounts(){
    const map = {};
    derivedItems.forEach(i => { map[i.name.toLowerCase()] = i.amount; });
    return map;
  }

  function addWeekEntry(day, text, meal){
    const trimmed = (text || '').trim();
    if (!trimmed) return;
    const before = snapshotDerivedAmounts();
    weekEntries.push({ id: uid('e'), day, text: trimmed, meal: meal || 'dinner', done:false });
    renderWeek();
    saveWeek();
    const hasRecipeData = !!findRecipeGroceryIngredients(trimmed);
    if (hasRecipeData){
      recomputeDerivedGroceryItems();
      const after = snapshotDerivedAmounts();
      const changed = Object.keys(after).some(k => !(k in before) || after[k] > before[k] + 1e-6);
      showToast(changed ? 'Added to your grocery list 🌱' : 'Your pantry already covers this recipe ✅');
    }
  }

  // Marking a meal "made" consumes its ingredients from pantry stock; un-marking gives them back.
  function adjustPantryStock(ing, sign){
    const key = ing.name.toLowerCase();
    if (!pantryStock[key]){
      pantryStock[key] = { amount: 0, unit: ing.unit, name: ing.name, namePlural: ing.namePlural || null };
    }
    const fam1 = unitFamily(pantryStock[key].unit);
    const fam2 = unitFamily(ing.unit);
    if (fam1 === fam2 && fam1 !== 'other'){
      pantryStock[key].amount += sign * convertAmount(ing.amount, ing.unit, pantryStock[key].unit);
    } else {
      pantryStock[key].amount += sign * ing.amount;
    }
  }

  function toggleWeekEntry(id){
    const e = weekEntries.find(x => x.id === id);
    if (!e) return;
    e.done = !e.done;
    const ingredients = findRecipeGroceryIngredients(e.text);
    if (ingredients){
      const sign = e.done ? -1 : 1; // made = consume stock; un-made = give it back
      ingredients.forEach(ing => {
        if (SKIP_GROCERY_NAMES.has(ing.name.toLowerCase())) return;
        adjustPantryStock(ing, sign);
      });
      savePantryStock();
    }
    renderWeek();
    saveWeek();
    recomputeDerivedGroceryItems();
  }
  function deleteWeekEntry(id){
    weekEntries = weekEntries.filter(x => x.id !== id);
    renderWeek();
    saveWeek();
    recomputeDerivedGroceryItems();
  }
  function cycleMeal(id){
    const e = weekEntries.find(x => x.id === id);
    if (!e) return;
    const idx = MEAL_TYPES.indexOf(e.meal);
    e.meal = MEAL_TYPES[(idx + 1) % MEAL_TYPES.length];
    renderWeek();
    saveWeek();
  }
  function clearWeek(){
    if (weekEntries.length === 0) return;
    if (window.confirm('Clear all meals planned for this week?')){
      weekEntries = [];
      renderWeek();
      saveWeek();
      recomputeDerivedGroceryItems();
    }
  }

  function renderRecipeBox(){
    recipeBoxScroll.innerHTML = '';
    MEAL_TYPES.forEach(meal => {
      const inMeal = RECIPE_BOX.filter(r => r.meal === meal);
      if (inMeal.length === 0) return;
      const groupWrap = document.createElement('div');
      groupWrap.className = 'rb-group';
      const title = document.createElement('div');
      title.className = 'rb-group-title';
      title.textContent = MEAL_LABELS[meal];
      groupWrap.appendChild(title);

      const chipsWrap = document.createElement('div');
      chipsWrap.className = 'rb-chips';

      inMeal.forEach(r => {
        const wrap = document.createElement('div');
        wrap.style.position = 'relative';
        wrap.style.display = 'inline-block';

        const chip = document.createElement('button');
        chip.className = 'rb-chip';
        chip.type = 'button';
        chip.textContent = '+ ' + r.name;
        chip.addEventListener('click', (ev) => {
          ev.stopPropagation();
          togglePopover(wrap, r);
        });

        wrap.appendChild(chip);
        chipsWrap.appendChild(wrap);
      });

      groupWrap.appendChild(chipsWrap);
      recipeBoxScroll.appendChild(groupWrap);
    });
  }

  function togglePopover(anchorEl, recipe){
    const existing = anchorEl.querySelector('.day-popover');
    closeAllPopovers();
    if (existing) return;

    const pop = document.createElement('div');
    pop.className = 'day-popover';
    let html = '<div class="hint">add to which day?</div>';
    DAY_ABBR.forEach((abbr, i) => {
      html += '<button type="button" data-day-index="' + i + '">' + abbr + '</button>';
    });
    pop.innerHTML = html;
    anchorEl.appendChild(pop);

    pop.querySelectorAll('button[data-day-index]').forEach(btn => {
      btn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        const dayIdx = parseInt(btn.getAttribute('data-day-index'), 10);
        addWeekEntry(DAYS[dayIdx], recipe.name, recipe.meal);
        closeAllPopovers();
      });
    });
  }
  function closeAllPopovers(){
    document.querySelectorAll('.day-popover').forEach(p => p.remove());
  }
  document.addEventListener('click', closeAllPopovers);

  function renderWeek(){
    renderRecipeBox();

    if (!weekLoaded){
      weekEl.innerHTML = '<div class="status">Loading your week…</div>';
      return;
    }

    let html = '';
    DAYS.forEach(day => {
      const dayEntries = weekEntries.filter(e => e.day === day);
      html += '<div class="day-card">';
      html += '<div class="day-header">' + day + '</div>';
      if (dayEntries.length > 0){
        html += '<ul class="entries">';
        dayEntries.forEach(e => {
          html += '<li class="entry' + (e.done ? ' done' : '') + '">' +
            '<button class="check' + (e.done ? ' checked' : '') + '" data-action="toggle" data-id="' + e.id + '" aria-label="Mark ' + escapeAttr(e.text) + (e.done ? ' not made' : ' made') + '">' + checkIconSvg() + '</button>' +
            '<span class="entry-text clickable" data-action="view" data-id="' + e.id + '" role="button" tabindex="0">' + escapeHtml(e.text) + '</span>' +
            '<button class="meal-tag tag-' + e.meal + '" data-action="cycle" data-id="' + e.id + '">' + MEAL_LABELS[e.meal] + '</button>' +
            '<button class="del" data-action="delete" data-id="' + e.id + '" aria-label="Remove ' + escapeAttr(e.text) + '">✕</button>' +
          '</li>';
        });
        html += '</ul>';
      }
      html += '<div class="week-add-row">' +
        '<input type="text" placeholder="Add a recipe…" data-day="' + day + '" autocomplete="off" />' +
        '<button class="week-add-btn" data-action="add" data-day="' + day + '" aria-label="Add recipe to ' + day + '">+</button>' +
      '</div>';
      html += '</div>';
    });
    weekEl.innerHTML = html;

    const totalCount = weekEntries.length;
    const doneCount = weekEntries.filter(e => e.done).length;
    weekCountLabel.textContent = totalCount + (totalCount === 1 ? ' meal planned' : ' meals planned') +
      (doneCount > 0 ? ' · ' + doneCount + ' made' : '');
  }

  weekEl.addEventListener('click', (e) => {
    const viewEl = e.target.closest('[data-action="view"]');
    if (viewEl){
      openRecipeModal(viewEl.getAttribute('data-id'));
      return;
    }
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const action = btn.getAttribute('data-action');
    const id = btn.getAttribute('data-id');
    if (action === 'toggle') toggleWeekEntry(id);
    if (action === 'delete') deleteWeekEntry(id);
    if (action === 'cycle') cycleMeal(id);
    if (action === 'add'){
      const day = btn.getAttribute('data-day');
      const input = weekEl.querySelector('input[data-day="' + day + '"]');
      addWeekEntry(day, input.value);
      input.value = '';
      input.focus();
    }
  });
  weekEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.matches('input[data-day]')){
      const day = e.target.getAttribute('data-day');
      addWeekEntry(day, e.target.value);
      e.target.value = '';
    }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-action="view"]')){
      e.preventDefault();
      openRecipeModal(e.target.getAttribute('data-id'));
    }
  });
  clearWeekBtn.addEventListener('click', clearWeek);

  /* ---------- recipe modal ---------- */
  function findRecipeDetails(text){
    if (RECIPE_DETAILS[text]) return RECIPE_DETAILS[text];
    const lower = text.trim().toLowerCase();
    const key = Object.keys(RECIPE_DETAILS).find(k => k.toLowerCase() === lower);
    return key ? RECIPE_DETAILS[key] : null;
  }

  function openRecipeModal(entryId){
    const entry = weekEntries.find(x => x.id === entryId);
    if (!entry) return;
    const details = findRecipeDetails(entry.text);

    let html = '<button class="modal-close" id="modalCloseBtn" aria-label="Close recipe">✕</button>';
    html += '<span class="modal-meal-tag tag-' + entry.meal + '">' + MEAL_LABELS[entry.meal] + '</span>';
    html += '<h2 class="modal-title">' + escapeHtml(entry.text) + '</h2>';

    if (!details){
      html += '<div class="modal-empty">🌿 No saved recipe details for this one yet.<br>Add it to the recipe box to see it here next time.</div>';
    } else {
      if (details.description) html += '<p class="modal-desc">' + escapeHtml(details.description) + '</p>';
      if (details.servings) html += '<div class="modal-servings">Makes ' + details.servings + (details.servings === 1 ? ' serving' : ' servings') + '</div>';
      if (details.prepTime || details.cookTime || details.totalTime){
        html += '<div class="modal-times">';
        if (details.prepTime) html += '<span><strong>Prep</strong> ' + escapeHtml(details.prepTime) + '</span>';
        if (details.cookTime) html += '<span><strong>Cook</strong> ' + escapeHtml(details.cookTime) + '</span>';
        if (details.totalTime) html += '<span><strong>Total</strong> ' + escapeHtml(details.totalTime) + '</span>';
        html += '</div>';
      }

      html += '<div class="modal-section-title">Ingredients</div>';
      html += '<ul class="modal-ingredients">';
      details.ingredients.forEach(ing => { html += '<li>' + escapeHtml(ing) + '</li>'; });
      html += '</ul>';

      html += '<div class="modal-section-title">Steps</div>';
      html += '<ol class="modal-steps">';
      details.steps.forEach(step => {
        html += '<li><div class="modal-step-body"><div class="modal-step-title">' + escapeHtml(step.title) + '</div><div class="modal-step-content">' + escapeHtml(step.content) + '</div></div></li>';
      });
      html += '</ol>';

      if (details.notes){
        html += '<div class="modal-notes"><strong>Notes:</strong> ' + escapeHtml(details.notes) + '</div>';
      }
    }

    recipeModalCard.innerHTML = html;
    recipeModalBackdrop.hidden = false;
    document.getElementById('modalCloseBtn').addEventListener('click', closeRecipeModal);
    recipeModalCard.scrollTop = 0;
  }

  function closeRecipeModal(){
    recipeModalBackdrop.hidden = true;
    recipeModalCard.innerHTML = '';
  }

  recipeModalBackdrop.addEventListener('click', (e) => {
    if (e.target === recipeModalBackdrop) closeRecipeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !recipeModalBackdrop.hidden) closeRecipeModal();
  });

  /* ---------- init ---------- */
  loadGrocery();
  loadPantryStock();
  loadDerivedChecked();
  loadWeek();
})();
</script>
</body>
</html>
